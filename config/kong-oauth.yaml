_format_version: "3.0"
_info:
  defaults: {}
  select_tags:
  - orders-oauth-lab
consumers:
- jwt_secrets:
  - algorithm: RS256
    key: orders-app
    rsa_public_key: |
      -----BEGIN PUBLIC KEY-----
      MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAnzWmvyYyd+u0O4HcCuyx
      EiQWIrOvz8yBTHueyGTDr6usqrqV+rufoQ6bsYurtI29EUctyF7DlpAx/O3ZEQem
      Le5Zt4cSXNDKdVkdf7lM5VzQuS/+75E6QVsXjoWXhwT8mfViiKn7ghjaTx5PRH0j
      S/3RIYmI+0Qwfe7g5Q1+B6HDADE2CGVXkrhrFBqbpb1DQPojvWorEEAZxCZSMoDp
      1JZ+qcCGlAXkvLR3mvPW684z2AxV4QaqyAzOTYF1PascQQqwLOF7DIrVAeT42zsS
      ZhvDOuF29Ahu2qmdkTuuWavFB/DTqiaIfPM9LLUar1HvHRtO6j/nmboa40/tVS1f
      9wIDAQAB
      -----END PUBLIC KEY-----
    secret: ${{ env "DECK_ORDERS_JWT_SECRET" }}
    tags:
    - orders-oauth-lab
  tags:
  - orders-oauth-lab
  username: orders-oauth-client
services:
- connect_timeout: 60000
  enabled: true
  host: httpbin.org
  name: orders-oauth-service
  port: 443
  protocol: https
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: orders-oauth-route
    path_handling: v0
    paths:
    - /orders-oauth
    plugins:
    - config:
        anonymous: null
        claims_to_verify:
        - exp
        cookie_names: []
        header_names:
        - authorization
        key_claim_name: azp
        maximum_expiration: 0
        realm: null
        run_on_preflight: true
        secret_is_base64: false
        uri_param_names:
        - jwt
      enabled: true
      name: jwt
      protocols:
      - grpc
      - grpcs
      - http
      - https
      tags:
      - orders-oauth-lab
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: true
    tags:
    - orders-oauth-lab
  tags:
  - orders-oauth-lab
  write_timeout: 60000
